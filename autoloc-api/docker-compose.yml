services:
  prometheus:
    image: prom/prometheus:latest
    container_name: autoloc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: autoloc-grafana
    ports:
      - "3000:3000"
    environment:
      # Lecture seule sans compte, pour consulter le tableau de bord en local ; l'administration reste protégée
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/autoloc-monitoring.json
    volumes:
      # Source de données et tableau de bord chargés automatiquement au démarrage
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
