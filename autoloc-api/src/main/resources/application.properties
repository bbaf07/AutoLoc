spring.application.name=autoloc-api
spring.profiles.default=dev

# Database connection (credentials come from environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logs
logging.level.root=INFO
logging.level.fr.ece.autoloc=INFO
